<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Action - MULTI STAGE</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            text-align: center;
            background-color: #0d0e15;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            font-size: clamp(15px, 3.2vw, 19px);
            margin: 2px 0;
            cursor: pointer;
        }
        .status {
            font-size: clamp(10px, 2vw, 12px);
            font-weight: bold;
            color: #ff0055;
            height: 16px;
            margin: 2px 0;
        }
        /* ゲーム画面（キャンバス）のラッパー */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 780px;
            aspect-ratio: 16 / 9;
            max-height: 50vh;
            margin: 2px auto;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid #ff0055;
            background-color: #161823;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .dev-panel {
            display: none;
            background: #262938;
            border: 2px solid #ffcc00;
            padding: 3px;
            margin: 2px 0;
            border-radius: 6px;
            max-width: 780px;
            width: 100%;
        }
        .dev-panel.active {
            display: block;
        }
        
        /* 操作パネル全体（コース外の下部に左右配置） */
        .controller-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 780px;
            width: 100%;
            margin: 4px auto 0 auto;
            padding: 0 5px;
        }

        /* 十字キー部分（3x3グリッド） */
        .d-pad {
            display: grid;
            grid-template-columns: 45px 45px 45px;
            grid-template-rows: 42px 42px 42px;
            gap: 3px;
            justify-content: center;
            align-content: center;
        }
        .d-btn {
            background-color: #262938;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 #008866;
            font-size: 11px;
            font-weight: bold;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .d-btn:active, .d-btn.active {
            background-color: #00ffcc;
            color: #0d0e15;
            transform: translateY(3px);
            box-shadow: 0 0 0 #008866;
        }
        
        #btnUpLeft   { grid-column: 1; grid-row: 1; }
        #btnJump     { grid-column: 2; grid-row: 1; }
        #btnUpRight  { grid-column: 3; grid-row: 1; }
        #btnLeft     { grid-column: 1; grid-row: 2; }
        #btnRight    { grid-column: 3; grid-row: 2; }
        #btnDown     { grid-column: 2; grid-row: 3; }

        /* 矢印アイコン */
        .arrow-icon {
            width: 0;
            height: 0;
            border-style: solid;
        }
        .arrow-up { border-width: 0 7px 10px 7px; border-color: transparent transparent currentColor transparent; }
        .arrow-down { border-width: 10px 7px 0 7px; border-color: currentColor transparent transparent transparent; }
        .arrow-left { border-width: 7px 10px 7px 0; border-color: transparent currentColor transparent transparent; }
        .arrow-right { border-width: 7px 0 7px 10px; border-color: transparent transparent transparent currentColor; }

        /* コース外右下に配置する5つのアクションボタン群 */
        .action-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(42px, 48px));
            grid-template-rows: repeat(2, minmax(42px, 48px));
            gap: 4px;
            justify-content: center;
        }
        .btn {
            background-color: #262938;
            color: #fff;
            border: 2px solid #ff0055;
            font-size: clamp(9px, 1.8vw, 11px);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2px;
            box-shadow: 0 3px 0 #88002d;
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .btn:active, .btn.active {
            background-color: #ff0055;
            color: #fff;
            transform: translateY(3px);
            box-shadow: 0 0 0 #88002d;
        }
        #btnRec      { grid-column: 1; grid-row: 1; }
        #btnPlay     { grid-column: 2; grid-row: 1; }
        #btnSpeedDown{ grid-column: 3; grid-row: 1; }
        #btnSpeedUp  { grid-column: 1; grid-row: 2; }
        #btnReset    { grid-column: 2; grid-row: 2; border-color: #ff3333; box-shadow: 0 3px 0 #880000; }
        #btnReset:active, #btnReset.active { background-color: #ff3333; box-shadow: 0 0 0 #880000; }
    </style>
</head>
<body>

    <h1 id="gameTitle">Ghost Action</h1>
    <div class="status" id="statusText">操作: [R] 録画 | [Space] 再生/停止 | [Q/E] 速度変更</div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="dev-panel" id="devPanel">
        <div style="color: #ffcc00; font-weight: bold; font-size: 11px; margin-bottom: 2px;">🔧 デベロッパーモード有効</div>
        <div style="display: flex; justify-content: center; gap: 6px;">
            <button class="btn" onclick="selectStage(0)" style="grid-column:auto; grid-row:auto; aspect-ratio: auto; padding: 4px 10px; border-color:#ffcc00; box-shadow:0 2px 0 #886600;">ステージ 1</button>
            <button class="btn" onclick="selectStage(1)" style="grid-column:auto; grid-row:auto; aspect-ratio: auto; padding: 4px 10px; border-color:#ffcc00; box-shadow:0 2px 0 #886600;">ステージ 2</button>
            <button class="btn" onclick="selectStage(2)" style="grid-column:auto; grid-row:auto; aspect-ratio: auto; padding: 4px 10px; border-color:#ffcc00; box-shadow:0 2px 0 #886600;">ステージ 3</button>
        </div>
    </div>

    <!-- コース外に分離・配置されたコントロールパネル -->
    <div class="controller-area">
        <!-- 左下の十字キー（斜め含む） -->
        <div class="d-pad">
            <button class="d-btn" id="btnUpLeft">
                <div style="display:flex; gap:1px; align-items:center;"><div class="arrow-icon arrow-left" style="transform:scale(0.7);"></div><div class="arrow-icon arrow-up" style="transform:scale(0.7);"></div></div>
            </button>
            <button class="d-btn" id="btnJump"><div class="arrow-icon arrow-up"></div></button>
            <button class="d-btn" id="btnUpRight">
                <div style="display:flex; gap:1px; align-items:center;"><div class="arrow-icon arrow-up" style="transform:scale(0.7);"></div><div class="arrow-icon arrow-right" style="transform:scale(0.7);"></div></div>
            </button>
            <button class="d-btn" id="btnLeft"><div class="arrow-icon arrow-left"></div></button>
            <button class="d-btn" id="btnRight"><div class="arrow-icon arrow-right"></div></button>
            <button class="d-btn" id="btnDown"><div class="arrow-icon arrow-down"></div></button>
        </div>

        <!-- コース外右下の5つのアクションボタン -->
        <div class="action-pad">
            <button class="btn" id="btnRec">🔴<br>録画</button>
            <button class="btn" id="btnPlay">▶<br>再生</button>
            <button class="btn" id="btnSpeedDown">Q<br>減速</button>
            <button class="btn" id="btnSpeedUp">E<br>加速</button>
            <button class="btn" id="btnReset">C<br>リセット</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('statusText');
const devPanel = document.getElementById('devPanel');
const gameTitle = document.getElementById('gameTitle');

const gravity = 0.45;
const keys = {};

let isRecording = false;
let recordedFrames = [];
let ghosts = [];
let bullets = [];
let bulletTimer = 0;
let particles = [];

let ghostSpeedRatio = 0.5;

let _x1 = false;
let _c1 = 0;
let _c2 = 0;
let _s1 = 0;

const barrier = {
    x: 100, y: 280, w: 15, h: 120,
    color: 'rgba(0, 229, 255, 0.6)',
    borderColor: '#00e5ff'
};

let startTime = Date.now();
let elapsedTime = 0;
let currentStageIndex = 0;

gameTitle.addEventListener('click', () => {
    if (_x1) return;
    if (_s1 === 0) {
        _c1++;
        if (_c1 >= 5) _s1 = 1;
    } else {
        _z_reset();
    }
});

canvas.addEventListener('click', (e) => {
    if (_x1) return;
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

    const stg = getCurrentStage();
    const goal = stg.goal;
    const isInsideGoal = clickX >= goal.x && clickX <= goal.x + goal.w &&
                         clickY >= goal.y && clickY <= goal.y + goal.h;

    if (_s1 === 1) {
        if (isInsideGoal) {
            _c2++;
            if (_c2 >= 5) {
                _x1 = true;
                devPanel.classList.add('active');
                updateStatus('🔧 デベロッパーモード有効');
            }
        } else {
            _z_reset();
        }
    } else {
        _z_reset();
    }
});

function _z_reset() {
    if (_x1) return;
    _c1 = 0;
    _c2 = 0;
    _s1 = 0;
}

window.addEventListener('keydown', e => {
    if (e.code === 'KeyR' && !e.repeat) toggleRecording();
    if (e.code === 'Space' && !e.repeat) { togglePlayback(); e.preventDefault(); }
    if (e.code === 'KeyC' && !e.repeat) resetAllGhosts();
    if (e.code === 'KeyQ' || e.code === 'BracketLeft') changeSpeed(-0.1);
    if (e.code === 'KeyE' || e.code === 'BracketRight') changeSpeed(0.1);
    keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

function changeSpeed(delta) {
    ghostSpeedRatio = Math.max(0.1, Math.min(2.0, Number((ghostSpeedRatio + delta).toFixed(1))));
    updateStatus(`ゴースト速度: ${ghostSpeedRatio.toFixed(1)}倍`);
}

function selectStage(index) {
    currentStageIndex = index;
    resetAllGhosts();
    startTime = Date.now();
    updateStatus(`ステージ ${index + 1} に移動しました`);
}

function bindTouchButton(id, codeNames, actionFunc) {
    const el = document.getElementById(id);
    if (!el) return;

    const pressOn = (e) => {
        e.preventDefault();
        if (actionFunc) actionFunc();
        if (codeNames) {
            const list = Array.isArray(codeNames) ? codeNames : [codeNames];
            list.forEach(c => keys[c] = true);
        }
        el.classList.add('active');
    };
    const pressOff = (e) => {
        e.preventDefault();
        if (codeNames) {
            const list = Array.isArray(codeNames) ? codeNames : [codeNames];
            list.forEach(c => keys[c] = false);
        }
        el.classList.remove('active');
    };

    el.addEventListener('mousedown', pressOn);
    el.addEventListener('mouseup', pressOff);
    el.addEventListener('mouseleave', pressOff);
    el.addEventListener('touchstart', pressOn, { passive: false });
    el.addEventListener('touchend', pressOff, { passive: false });
    el.addEventListener('touchcancel', pressOff, { passive: false });
}

bindTouchButton('btnLeft', 'ArrowLeft');
bindTouchButton('btnRight', 'ArrowRight');
bindTouchButton('btnJump', ['ArrowUp', 'KeyW']);
bindTouchButton('btnDown', 'ArrowDown');
bindTouchButton('btnUpLeft', ['ArrowUp', 'ArrowLeft']);
bindTouchButton('btnUpRight', ['ArrowUp', 'ArrowRight']);
bindTouchButton('btnRec', null, toggleRecording);
bindTouchButton('btnPlay', null, togglePlayback);
bindTouchButton('btnSpeedDown', null, () => changeSpeed(-0.1));
bindTouchButton('btnSpeedUp', null, () => changeSpeed(0.1));
bindTouchButton('btnReset', null, resetAllGhosts);

const player = {
    x: 40, y: 350, w: 22, h: 26, vx: 0, vy: 0, prevY: 350, isGrounded: false, color: '#00ffcc'
};

const stages = [
    {
        start: { x: 40, y: 350 },
        goal: { x: 720, y: 70, w: 35, h: 60 },
        map: [
            { x: 0, y: 400, w: 200, h: 50 },
            { x: 340, y: 300, w: 60, h: 20 },
            { x: 500, y: 250, w: 300, h: 200 },
            { x: 650, y: 130, w: 150, h: 20 },
            { x: 0, y: 0, w: 15, h: 450 },
            { x: 785, y: 0, w: 15, h: 450 }
        ],
        spikes: [{ x: 200, y: 430, w: 300, h: 20 }],
        movingSpikes: [],
        windZones: [],
        switches: [],
        doors: [],
        shooterEnemies: [{ x: 720, y: 210, w: 30, h: 40 }],
        movingEnemies: [{ x: 520, y: 224, w: 26, h: 26, vx: -0.8, minX: 510, maxX: 640 }]
    },
    {
        start: { x: 40, y: 350 },
        goal: { x: 730, y: 60, w: 35, h: 60 },
        map: [
            { x: 0, y: 400, w: 150, h: 50 },
            { x: 250, y: 320, w: 50, h: 20 },
            { x: 450, y: 220, w: 50, h: 20 },
            { x: 600, y: 120, w: 200, h: 330 },
            { x: 0, y: 0, w: 15, h: 450 },
            { x: 785, y: 0, w: 15, h: 450 }
        ],
        spikes: [{ x: 150, y: 430, w: 450, h: 20 }],
        movingSpikes: [{ x: 350, y: 200, w: 40, h: 20, vy: 1.5, minY: 150, maxY: 380 }],
        windZones: [{ x: 180, y: 100, w: 120, h: 300, forceX: 0, forceY: -0.468 }],
        switches: [],
        doors: [],
        shooterEnemies: [{ x: 730, y: 180, w: 30, h: 40 }],
        movingEnemies: []
    },
    {
        start: { x: 40, y: 350 },
        goal: { x: 720, y: 220, w: 35, h: 60 },
        map: [
            { x: 0, y: 400, w: 180, h: 50 },
            { x: 260, y: 280, w: 80, h: 20 },
            { x: 480, y: 200, w: 80, h: 20 },
            { x: 650, y: 400, w: 150, h: 50 },
            { x: 0, y: 0, w: 15, h: 450 },
            { x: 785, y: 0, w: 15, h: 450 },
            // 赤い砲台(y: 230付近)の真上に設置した床（足場）
            { x: 710, y: 215, w: 55, h: 10 }
        ],
        spikes: [{ x: 180, y: 430, w: 470, h: 20 }],
        movingSpikes: [],
        windZones: [],
        // 床のすぐ上にスイッチを設置
        switches: [{ x: 722, y: 205, w: 30, h: 10, pressed: false, targetDoorId: 0 }],
        // ゴールの周りを完全に囲むドア（左右・上）
        doors: [
            { id: 0, x: 670, y: 160, w: 20, h: 140, open: false }, // 左壁
            { id: 0, x: 760, y: 160, w: 20, h: 140, open: false }, // 右壁
            { id: 0, x: 670, y: 145, w: 110, h: 20, open: false }  // 上天井
        ],
        shooterEnemies: [{ x: 720, y: 230, w: 30, h: 40 }], // 赤い砲台（もともとの位置）
        movingEnemies: []
    }
];

function getCurrentStage() {
    return stages[currentStageIndex];
}

function toggleRecording() {
    if (!isRecording) {
        isRecording = true;
        recordedFrames = [];
        updateStatus('🔴 録画中...');
    } else {
        isRecording = false;
        if (recordedFrames.length > 0) {
            ghosts.push({
                x: recordedFrames[0].x,
                y: recordedFrames[0].y,
                w: 22, h: 26,
                frames: [...recordedFrames],
                progress: 0,
                state: 'IDLE'
            });
            updateStatus('🟢 録画完了 -> 再生ボタンを押してください');
        } else {
            updateStatus('録画データが空です');
        }
    }
}

function togglePlayback() {
    const targetGhost = ghosts.slice().reverse().find(g => g.state === 'IDLE' || g.state === 'REPLAYING');
    if (!targetGhost) return;

    if (targetGhost.state === 'IDLE') {
        targetGhost.state = 'REPLAYING';
        updateStatus('▶️ ゴースト再生中...（もう一度押すと足場化）');
    } else if (targetGhost.state === 'REPLAYING') {
        const index = Math.floor(targetGhost.progress);
        if (targetGhost.frames[index]) {
            targetGhost.x = targetGhost.frames[index].x;
            targetGhost.y = targetGhost.frames[index].y;
        }
        targetGhost.state = 'STOPPED';
        updateStatus('⏹️ 足場化完了');
    }
}

function resetAllGhosts() {
    isRecording = false;
    recordedFrames = [];
    ghosts = [];
    bullets = [];
    particles = [];
    const stg = getCurrentStage();
    if (stg.switches) stg.switches.forEach(s => s.pressed = false);
    if (stg.doors) stg.doors.forEach(d => d.open = false);
    respawnPlayer();
    updateStatus('リセットしました');
}

function respawnPlayer() {
    const stg = getCurrentStage();
    player.x = stg.start.x;
    player.y = stg.start.y;
    player.vx = 0;
    player.vy = 0;
}

function updateStatus(msg) {
    statusText.innerText = msg;
}

function isColliding(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
    return `${m}:${s}.${cs}`;
}

function createBulletDestroyEffect(x, y) {
    for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20
        });
    }
}

function update() {
    elapsedTime = Date.now() - startTime;
    const stg = getCurrentStage();
    player.prevY = player.y;

    if (keys['ArrowRight'] || keys['KeyD']) player.vx = 4.2;
    else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -4.2;
    else player.vx = 0;

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['KeyK']) && player.isGrounded) {
        player.vy = -9.5;
        player.isGrounded = false;
    }

    player.vy += gravity;

    for (let w of stg.windZones) {
        if (isColliding(player, w)) {
            player.vx += w.forceX;
            player.vy += w.forceY;
        }
    }

    player.x += player.vx;
    for (let b of stg.map) {
        if (isColliding(player, b)) {
            if (player.vx > 0) player.x = b.x - player.w;
            else if (player.vx < 0) player.x = b.x + b.w;
        }
    }
    for (let d of stg.doors) {
        if (!d.open && isColliding(player, d)) {
            if (player.vx > 0) player.x = d.x - player.w;
            else if (player.vx < 0) player.x = d.x + d.w;
        }
    }

    const isPressingDown = keys['KeyS'] || keys['ArrowDown'];
    if (player.vy >= 0 && !isPressingDown) {
        for (let g of ghosts) {
            if (g.state === 'STOPPED' && isColliding(player, g)) {
                const wasAbove = player.prevY + player.h <= g.y + 6;
                if (!wasAbove) {
                    const bounceSpeed = 5.0;
                    let angleDeg = (player.vx > 0) ? (210 + Math.random() * 120) : (30 + Math.random() * 120);
                    const rad = angleDeg * Math.PI / 180;
                    player.vx = Math.sin(rad) * bounceSpeed;
                    player.vy = -Math.cos(rad) * bounceSpeed;
                }
            }
        }
    }

    player.y += player.vy;
    player.isGrounded = false;

    for (let b of stg.map) {
        if (isColliding(player, b)) {
            if (player.vy > 0) {
                player.y = b.y - player.h; player.vy = 0; player.isGrounded = true;
            } else if (player.vy < 0) {
                player.y = b.y + b.h; player.vy = 0;
            }
        }
    }
    for (let d of stg.doors) {
        if (!d.open && isColliding(player, d)) {
            if (player.vy > 0) {
                player.y = d.y - player.h; player.vy = 0; player.isGrounded = true;
            } else if (player.vy < 0) {
                player.y = d.y + d.h; player.vy = 0;
            }
        }
    }

    // スイッチ判定（プレイヤーまたは足場化されたゴーストがスイッチに触れたら開く）
    for (let sw of stg.switches) {
        let isActivated = isColliding(player, sw);
        if (!isActivated) {
            for (let g of ghosts) {
                if (g.state === 'STOPPED' && isColliding(g, sw)) {
                    isActivated = true;
                    break;
                }
            }
        }
        if (isActivated) {
            sw.pressed = true;
            stg.doors.forEach(d => {
                if (d.id === sw.targetDoorId) d.open = true;
            });
        }
    }

    if (!isPressingDown && player.vy >= 0) {
        for (let g of ghosts) {
            if (g.state === 'STOPPED') {
                if (player.x < g.x + g.w && player.x + player.w > g.x &&
                    player.prevY + player.h <= g.y + 8 && player.y + player.h >= g.y) {
                    player.y = g.y - player.h;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            }
        }
    }

    if (player.y <= 20) respawnPlayer();
    for (let s of stg.spikes) {
        if (isColliding(player, s)) respawnPlayer();
    }
    if (player.y > canvas.height + 50) respawnPlayer();
    for (let ms of stg.movingSpikes) {
        ms.y += ms.vy;
        if (ms.y < ms.minY || ms.y > ms.maxY) ms.vy *= -1;
        if (isColliding(player, ms)) respawnPlayer();
    }
    for (let me of stg.movingEnemies) {
        me.x += me.vx;
        if (me.x < me.minX || me.x > me.maxX) me.vx *= -1;
        if (isColliding(player, me)) respawnPlayer();
    }

    bulletTimer++;
    if (bulletTimer % 120 === 0) {
        for (let se of stg.shooterEnemies) {
            bullets.push({ x: se.x, y: se.y + 10, r: 6, vx: -3.5, vy: 0, life: 0 });
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life++;

        if (b.life >= 600) {
            bullets.splice(i, 1);
            continue;
        }

        if (b.x - b.r <= 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
        else if (b.x + b.r >= canvas.width) { b.x = canvas.width - b.r; b.vx = -Math.abs(b.vx); }
        if (b.y - b.r <= 0) { b.y = b.r; b.vy = Math.abs(b.vy); }
        else if (b.y + b.r >= canvas.height) { b.y = canvas.height - b.r; b.vy = -Math.abs(b.vy); }

        let collisionBlocks = [...stg.map];
        for (let d of stg.doors) {
            if (!d.open) collisionBlocks.push(d);
        }

        for (let block of collisionBlocks) {
            let testX = b.x, testY = b.y;
            if (b.x < block.x) testX = block.x;
            else if (b.x > block.x + block.w) testX = block.x + block.w;
            if (b.y < block.y) testY = block.y;
            else if (b.y > block.y + block.h) testY = block.y + block.h;

            let distX = b.x - testX, distY = b.y - testY;
            let distance = Math.sqrt(distX * distX + distY * distY);

            if (distance < b.r) {
                if (distance > 0) {
                    let nx = distX / distance, ny = distY / distance;
                    let overlap = b.r - distance;
                    b.x += nx * overlap; b.y += ny * overlap;
                    let dot = b.vx * nx + b.vy * ny;
                    b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
                } else {
                    b.y -= b.r; b.vy *= -1;
                }
            }
        }

        for (let g of ghosts) {
            if (g.state === 'STOPPED') {
                let testX = b.x, testY = b.y;
                if (b.x < g.x) testX = g.x;
                else if (b.x > g.x + g.w) testX = g.x + g.w;
                if (b.y < g.y) testY = g.y;
                else if (b.y > g.y + g.h) testY = g.y + g.h;

                let distX = b.x - testX, distY = b.y - testY;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < b.r) {
                    if (distance > 0) {
                        let nx = distX / distance, ny = distY / distance;
                        let overlap = b.r - distance;
                        b.x += nx * overlap; b.y += ny * overlap;
                    } else {
                        b.y -= b.r;
                    }
                    const speed = 4.0;
                    let angleDeg = (b.vx < 0) ? (30 + Math.random() * 120) : (210 + Math.random() * 120);
                    const rad = angleDeg * Math.PI / 180;
                    b.vx = Math.sin(rad) * speed; b.vy = -Math.cos(rad) * speed;
                    break;
                }
            }
        }

        let bulletBox = { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 };
        if (isColliding(bulletBox, barrier)) {
            createBulletDestroyEffect(b.x, b.y);
            bullets.splice(i, 1);
            continue;
        }
        if (isColliding(player, bulletBox)) {
            respawnPlayer();
            bullets.splice(i, 1);
            continue;
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (isRecording) {
        recordedFrames.push({ x: player.x, y: player.y });
    }

    for (let g of ghosts) {
        if (g.state === 'REPLAYING') {
            g.progress += ghostSpeedRatio;
            const index = Math.floor(g.progress);
            if (index < g.frames.length) {
                g.x = g.frames[index].x;
                g.y = g.frames[index].y;
            } else {
                g.progress = 0;
            }
        }
    }

    if (isColliding(player, stg.goal)) {
        if (currentStageIndex < stages.length - 1) {
            alert(`STAGE ${currentStageIndex + 1} CLEAR! 次のステージへ進みます。`);
            currentStageIndex++;
            resetAllGhosts();
        } else {
            alert(`ALL STAGES CLEAR!\nクリアタイム: ${formatTime(elapsedTime)}`);
            currentStageIndex = 0;
            startTime = Date.now();
            resetAllGhosts();
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const stg = getCurrentStage();

    ctx.fillStyle = 'rgba(0, 200, 255, 0.15)';
    for (let w of stg.windZones) ctx.fillRect(w.x, w.y, w.w, w.h);

    ctx.fillStyle = '#262938';
    for (let b of stg.map) ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = barrier.color;
    ctx.fillRect(barrier.x, barrier.y, barrier.w, barrier.h);
    ctx.strokeStyle = barrier.borderColor;
    ctx.lineWidth = 2;
    ctx.strokeRect(barrier.x, barrier.y, barrier.w, barrier.h);

    for (let d of stg.doors) {
        if (!d.open) {
            ctx.fillStyle = '#ff9900';
            ctx.fillRect(d.x, d.y, d.w, d.h);
        }
    }

    for (let sw of stg.switches) {
        ctx.fillStyle = sw.pressed ? '#00ffcc' : '#ff3366';
        ctx.fillRect(sw.x, sw.y, sw.w, sw.h);
    }

    ctx.fillStyle = '#ff3333';
    for (let x = 0; x < canvas.width; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 10, 20); ctx.lineTo(x + 20, 0); ctx.fill();
    }
    for (let s of stg.spikes) {
        for (let x = s.x; x < s.x + s.w; x += 15) {
            ctx.beginPath(); ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 7.5, s.y); ctx.lineTo(x + 15, s.y + s.h); ctx.fill();
        }
    }
    ctx.fillStyle = '#ff00aa';
    for (let ms of stg.movingSpikes) ctx.fillRect(ms.x, ms.y, ms.w, ms.h);

    ctx.fillStyle = '#ff3333';
    for (let se of stg.shooterEnemies) ctx.fillRect(se.x, se.y, se.w, se.h);
    ctx.fillStyle = '#aa00ff';
    for (let me of stg.movingEnemies) ctx.fillRect(me.x, me.y, me.w, me.h);

    ctx.fillStyle = '#ff9900';
    for (let b of bullets) {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#00ffff';
    for (let p of particles) ctx.fillRect(p.x, p.y, 3, 3);

    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(stg.goal.x, stg.goal.y, stg.goal.w, stg.goal.h);

    for (let g of ghosts) {
        if (g.state === 'STOPPED') {
            ctx.fillStyle = '#9933ff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.fillRect(g.x, g.y, g.w, g.h); ctx.strokeRect(g.x, g.y, g.w, g.h);
            ctx.fillStyle = '#00ffcc'; ctx.fillRect(g.x, g.y, g.w, 3);
        } else if (g.state === 'REPLAYING') {
            ctx.fillStyle = 'rgba(255, 50, 150, 0.7)'; ctx.fillRect(g.x, g.y, g.w, g.h);
        } else {
            ctx.fillStyle = 'rgba(250, 250, 250, 0.3)'; ctx.fillRect(g.x, g.y, g.w, g.h);
        }
    }

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.fillStyle = '#ffffff'; ctx.font = '16px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`TIME: ${formatTime(elapsedTime)}  STAGE: ${currentStageIndex + 1}/3`, 25, 35);
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(`ゴースト速度: (${ghostSpeedRatio.toFixed(1)}倍)`, 25, 60);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
